<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ff2f6d" />
  <title>Be My Valentine 💘</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Background hearts -->
  <canvas id="heartsCanvas" aria-hidden="true"></canvas>

  <!-- Fireworks layer -->
  <canvas id="fireworksCanvas" aria-hidden="true"></canvas>

  <!-- Top message shown only after YES -->
  <div id="loveBanner" class="loveBanner" aria-hidden="true">
    You are the most beautiful valentine. I love you 💖
  </div>

  <!-- Minimal page (removed after YES) -->
  <main id="page">
    <section class="section hero">
      <div class="card glass">
        <div class="tag">💗 Valentine Mode</div>
        <h1 class="title" id="theirName">My Favorite Human</h1>
        <p class="subtitle">Scroll down… I have one important question.</p>
        <div class="hint">↓ scroll ↓</div>
      </div>
    </section>

    <section class="section finale">
      <div class="card glass">
        <h2 class="q">Will you be my Valentine? 😳💘</h2>
        <p class="sub">Click carefully. This has… consequences.</p>
        <div class="row">
          <button class="btn primary" id="yesBtn" type="button">YES 💖</button>
          <button class="btn ghost" id="noBtn" type="button">No 🙃</button>
        </div>
        <div class="small" id="msg" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
